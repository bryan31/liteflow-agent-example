spring:
  application:
    name: liteflow-agent-web-local-mysql
  config:
    import: optional:classpath:application-local.yml

server:
  port: 8903
liteflow:
  rule-source: agent/flow.el.xml
  print-banner: false
  agent:
    session-store:
      type: MYSQL
      mysql:
        jdbc-url: "${MYSQL_JDBC_URL:jdbc:mysql://localhost:3306/liteflow_agent_local}"
        username: "${MYSQL_USER:liteflow}"
        password: "${MYSQL_PASSWORD:liteflow_example}"
        database-name: "${MYSQL_DATABASE:liteflow_agent_local}"
        table-name: agentscope_sessions
        create-if-not-exist: true
    harness:
      local:
        workspace-root: "./data"
      filesystem-backend: GUARDED_LOCAL
    skills:
      enabled: true
      path: classpath:agent/skills
    openai-compatible:
      deepseek:
        api-key: "${DEEPSEEK_API_KEY:}"
        base-url: "${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}"
example:
  agent:
    model: "${DEEPSEEK_MODEL:deepseek-flash}"
