services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-liteflow_agent_local}
      MYSQL_USER: ${MYSQL_USER:-liteflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-liteflow_example}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_example}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
