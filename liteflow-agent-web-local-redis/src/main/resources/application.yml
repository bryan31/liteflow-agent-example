spring:
  application:
    name: liteflow-agent-web-local-redis
  config:
    import: optional:classpath:application-local.yml

server:
  port: 8904
liteflow:
  rule-source: agent/flow.el.xml
  print-banner: false
  agent:
    session-store:
      type: REDIS
      redis:
        uri: "${REDIS_URI:redis://localhost:6379/0}"
        key-prefix: "liteflow-agent-web-local-redis:"
    harness:
      local:
        workspace-root: "./data"
      filesystem-backend: GUARDED_LOCAL
    skills:
      enabled: true
      path: classpath:agent/skills
    openai-compatible:
      deepseek:
        api-key: "${DEEPSEEK_API_KEY:}"
        base-url: "${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}"
example:
  agent:
    model: "${DEEPSEEK_MODEL:deepseek-flash}"
