services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: liteflow_agent
      MYSQL_USER: liteflow
      MYSQL_PASSWORD: liteflow_example
      MYSQL_ROOT_PASSWORD: root_example
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uliteflow -pliteflow_example --silent"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
