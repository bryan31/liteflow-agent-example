spring:
  application:
    name: liteflow-agent-web-local-json
  config:
    import: optional:classpath:application-local.yml

server:
  port: 8905
liteflow:
  rule-source: agent/flow.el.xml
  print-banner: false
  agent:
    session-store:
      json-workspace-root: "./data"
      type: JSON
      json-root: "./data/local-json/agent-state"
    harness:
      local:
        workspace-root: "./data"
      filesystem-backend: GUARDED_LOCAL
    skills:
      enabled: true
      path: classpath:agent/skills
    openai-compatible:
      deepseek:
        api-key: "${DEEPSEEK_API_KEY:}"
        base-url: "${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}"
example:
  agent:
    model: "${DEEPSEEK_MODEL:deepseek-flash}"
  artifacts:
    root: "./data/local-json/artifacts"
